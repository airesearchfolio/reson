
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESON</title>
  <meta name="description" content="RESON research project">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f7f8fa;
      color: #1f2937;
    }

    .card {
      width: min(620px, 90%);
      padding: 48px 36px;
      text-align: center;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.5rem;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 28px;
      color: #6b7280;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      background: #111827;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      opacity: 0.88;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>RESON</h1>
    <p>
      Project website for RESON.<br>
      Code and project materials are available on GitHub.
    </p>
    <a href="https://github.com/airesearchfolio/reson" target="_blank" rel="noopener noreferrer">
      View GitHub Repository
    </a>
  </main>
</body>
</html>
